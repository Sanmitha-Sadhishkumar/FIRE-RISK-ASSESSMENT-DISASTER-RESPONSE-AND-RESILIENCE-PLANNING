<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fire Risk Assessment and Rescue Route Planning</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <style>
       /* Reset default styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  transition: all 0.3s ease-in-out;
}

/* Body Styling */
body {
  font-family: 'Roboto', sans-serif;
  background-color: #2c2c2c;
  color: #fff;
  background-size: cover;
  background-position: center;
  z-index: -1;
  line-height: 1.6;
}

/* Navbar Styling */
nav {
  background-color: #3a3a3a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
}

nav .logo {
  color: #ff5722;
  font-size: 2rem;
  font-weight: bold;
}

nav ul {
  display: flex;
  list-style: none;
}

nav ul li {
  margin-left: 2rem;
}

nav a {
  color: #ff5722;
  text-decoration: none;
  font-size: 1.2rem;
}

nav a:hover {
  color: #fff;
  background-color: #ff5722;
  padding: 0.3rem 0.8rem;
  border-radius: 8px;
}

nav a.active {
  border: 2px solid #ff5722;
  padding: 0.3rem 0.8rem;
  border-radius: 8px;
}

/* Hero Section */
.hero-section {
  background-color: #3a3a3a;
  text-align: center;
  padding: 3rem 2rem;
}

.hero-section h1 {
  color: #ff5722;
  font-size: 3.5rem;
  margin-bottom: 1rem;
}

.hero-section p {
  font-size: 1.3rem;
  color: #e0e0e0;
  max-width: 800px;
  margin: 0 auto;
}

/* Form Section */
.form-section {
  background-color: #3a3a3a;
  padding: 2rem;
  max-width: 900px;
  margin: 50px auto;
  border-radius: 8px;
  text-align: center;
}

.form-section h2 {
  color: #ff5722;
  font-size: 2.5rem;
  margin-bottom: 2rem;
}

.form-container {
  background-color: #444;
  padding: 2rem;
  border-radius: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
}

.form-group {
  flex: 1 1 45%;
  min-width: 250px;
  text-align: left;
  display: inline-block;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #ff5722;
  font-size: 1rem;
}

.form-group input[type="file"],
.form-group input[type="text"],
.form-group select {
  width: 100%;
  padding: 0.8rem;
  font-size: 1rem;
  background-color: #555;
  color: #fff;
  border: 1px solid #ff5722;
  border-radius: 5px;
}

.form-group button {
  background-color: #ff5722;
  color: #fff;
  padding: 1rem 3rem;
  font-size: 1.2rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 1.5rem;
}

.form-group button:hover {
  background-color: #e64a19;
}

/* Section Titles */
h2, h3 {
  color: #ff5722;
}

h2 {
  font-size: 2.5rem;
  margin: 2rem 0;
}

h3 {
  font-size: 1.5rem;
  margin: 2rem 0;
}

/* Ticker */
.ticker {
  background-color: #ff5722;
  color: #fff;
  font-weight: bold;
  padding: 0.5rem 1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Image Section */
.image-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 3rem;
  margin-right: 20px;
}

.image-item {
  width: 80%;
  text-align: center;
}

.image-item img, .image-item iframe {
  width: 100%;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.image-label, #seismic-label {
  color: #ff5722;
  font-weight: bold;
  margin-top: 1rem;
}

/* Loader */
#loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 999;
  text-align: center;
}

.spinner {
  border: 6px solid #2c2c2c;
  border-top: 6px solid #ff5722;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Suggestion Cards */
.suggestion-card {
  background-color: #444;
  color: #fff;
  padding: 1.5rem;
  border-radius: 12px;
  margin-top: 20px;
  border: 1px solid #ff5722;
  box-shadow: 0 4px 8px rgba(255,87,34,0.2);
}

/* Footer */
footer {
  background-color: #2c2c2c;
  text-align: center;
  padding: 1rem;
  font-size: 0.9rem;
  color: #aaa;
}

/* Lists */
ul {
  padding-left: 20px;
}

li {
  margin-bottom: 10px;
  color: #ccc;
}

/* Hide Toggle Button */
.toggle-btn {
  display: none;
}

/* Responsive Adjustments */
@media (max-width: 768px) {
  nav ul {
    flex-direction: column;
    align-items: center;
  }

  nav ul li {
    margin: 1rem 0;
  }

  .image-item {
    width: 100%;
  }

  .form-container {
    flex-direction: column;
  }
}

/* Custom Scrollbar for WebKit Browsers */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: #2c2c2c;
}

::-webkit-scrollbar-thumb {
  background: #ff5722;
  border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
  background: #e64a19;
}

/* Two Column Layout */
#left-container {
  display: inline-block;
  float: right;
  width: 70%;
}

#panel {
  display: inline-block;
  float: left;
  width: 30%;
  text-align: center;
}
.alert-box {
      background-color: #ffefef;
      border-left: 8px solid #e53935;
      padding: 20px;
      margin: 50px auto;
      max-width: 800px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      animation: fadeIn 1s ease-out;
    }

    .alert-box h2 {
      color: #b71c1c;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .alert-box p {
      font-size: 16px;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .highlight {
      color: #c62828;
      font-weight: bold;
    }
    .source-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 14px;
      color: #1565c0;
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .image-grid {
    display: grid;
    grid-template-columns: repeat(1, 1fr); /* 2 columns of equal width */
    gap: 20px; /* Space between the images */
    max-width: 600px;
    margin: auto;
    margin-left:30px;
    margin-top: 50px;
}

/* Styling the images to make them the same size */
.image-grid img {
    width: 100%; /* Ensures images fill the grid cell */
    object-fit: cover; /* Ensures images cover the space without distorting */
    border-radius: 8px; /* Optional: Add rounded corners to images */
}
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">ResQLink</div>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <div id="left-container">
  <!-- Form Section -->
  <section class="form-section">
    <h2>Upload Fire Risk Assessment and Rescue Route Planning Data</h2>
    <div class="form-container">
      <form action="/fire_risk" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="file1">Enter Latitude:</label>
          <input type="text" id="file1" name="file1"required>
        </div>
        <div class="form-group">
          <label for="file2">Enter Longiitude:</label>
          <input type="text" id="file2" name="file2"required>
        </div>
        <div class="form-group">
          <button type="submit">Generate Evacuation Path</button>
        </div>
      </form>
    </div>
  </section>
  {% if image %}
  <section class="image-section">
      <div class="image-container">
      <div class="image-item">
        <div class="image-label">Fire Spread</div>
        <iframe src="{{ url_for('static', filename='display/' + html1) }}" 
        width="1200px" height="600px" style="border:none;">
</iframe>
      </div>
    </div>
    <div class="image-container">
      <div class="image-item">
        <div class="image-label">Resue Route</div>
        <iframe src="{{ url_for('static', filename='display/' + html2) }}" 
        width="1200px" height="600px" style="border:none;">
</iframe>
      </div>
    </div>
  </section>
  {% endif %}
</div>
<div id="panel">
  <div class="image-grid">
  <img src="{{ url_for('static', filename='display/reference_image.webp') }}" alt="Image 1">
  <img src="{{ url_for('static', filename='display/reference_image_fire_spread.webp') }}" alt="Image 2"></div>
</div>
</body>
</html>
