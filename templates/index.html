function getUserLocation() {
  return new Promise((resolve, reject) => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const coords = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
          };
          resolve(coords);
        },
        (error) => {
          reject(error);
        }
      );
    } else {
      reject(new Error("Geolocation is not supported by this browser."));
    }
  });
}

async function loadDisasterAlerts() {
  const feed = document.getElementById("feed-para");
  let alerts = [];
  try {
    const res = await fetch('https://eonet.gsfc.nasa.gov/api/v3/events?status=open');

    if (!res.ok) {
      console.error("Failed to fetch disaster data.");
      return;
    }

    const data = await res.json();
    console.log("Fetched data:", data);  // Debugging the data fetched

    const sortedEvents = data.events.sort((a, b) => {
      const dateA = a.geometry && a.geometry[0].date ? new Date(a.geometry[0].date) : new Date(0);
      const dateB = b.geometry && b.geometry[0].date ? new Date(b.geometry[0].date) : new Date(0);
      return dateB - dateA;
    });

    sortedEvents.forEach(event => {
      const category = event.categories[0].title;
      const title = event.title;
      const geometry = event.geometry[0];
      const date = geometry && geometry.date ? new Date(geometry.date) : null;

      const severityEmoji = {
        'Volcanoes': '🌋',
        'Wildfires': '🔥',
        'Severe Storms': '🌩️',
        'Floods': '🌊',
        'Earthquakes': '💥'
      };

      // Format date as "DD MMM YYYY, HH:mm"
      const formattedDate = date
        ? `${date.getDate().toString().padStart(2, '0')} ${date.toLocaleString('default', { month: 'short' })} ${date.getFullYear()}, ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`
        : 'Date unknown';

      alerts.push(`${severityEmoji[category] || '⚠️'} ${title} (${formattedDate})`);
    });
  } catch (error) {
    console.error("Error loading disaster alerts:", error);
  } finally {
    feed.innerText = alerts.join(" | ");
    console.log("Alerts:", alerts);
  }
}

// Load disaster alerts when the page is loaded
loadDisasterAlerts();

<script>
  const feedUrls = [
    'https://api.rss2json.com/v1/api.json?rss_url=https://reliefweb.int/headlines/rss.xml',
    'https://api.rss2json.com/v1/api.json?rss_url=https://www.gdacs.org/rss.aspx'
  ];

  const feedContainer = document.getElementById('feed');

  async function loadFeeds() {
    for (const url of feedUrls) {
      try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.items) {
          data.items.slice(0, 5).forEach(item => {
            const div = document.createElement('div');
            div.className = 'feed-item';
            div.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a><p>${item.pubDate}</p>`;
            feedContainer.appendChild(div);
          });
        }
      } catch (error) {
        console.error('Error loading feed:', error);
      }
    }
  }

  loadFeeds();
</script>
